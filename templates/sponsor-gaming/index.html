<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>sponsor-gaming</title>
  <link rel="stylesheet" href="/templates/_runtime/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="preview-wrap">
    <div id="viewport">
      <div id="stage"></div>
    </div>
  </div>
  <div id="preview-ui" hidden>
    <button data-play title="เล่น/หยุด (Space)">❚❚</button>
    <input data-scrub type="range" min="0" step="0.01" value="0">
    <span data-time></span>
  </div>
  <script type="module">
    import { run } from '/templates/_runtime/runtime.js';
    import template from './timeline.js';
    run(template).catch((err) => {
      console.error(err);
      window.overlay = { error: String(err && err.stack || err) };
    });
  </script>
</body>
</html>
